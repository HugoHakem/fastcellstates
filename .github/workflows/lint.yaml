name: Lint

on:
  push:
    branches: [main]
    paths-ignore: [docs/**]
  pull_request:
    branches: [main]
    paths-ignore: [docs/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
      # Mirrors the `lint` pixi task in pyproject.toml step by step, so a
      # failure here points straight at which check broke.
      - name: Ruff lint
        run: pixi run ruff check src test benchmarks
      - name: Ruff format check
        run: pixi run ruff format --check src test
      - name: mypy
        run: pixi run mypy src
      - name: pyright
        run: pixi run pyright src
