[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastcellstates"
version = "0.2.0"
description = "A numba reimplementation of cellstates: fast, sparse, composable Dirichlet-multinomial cell-state clustering for scRNA-seq."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# fastcellstates is a numba reimplementation of cellstates (Grobecker & van
# Nimwegen, PLoS Comput Biol 2024), MIT-licensed like the original. `authors`
# here is authorship of *this* codebase; the original model and algorithm are
# credited in docs/changes.md, README.md and CITATION.cff instead, and in the
# dual copyright notice in LICENSE.
authors = [
  { name = "Hugo Hakem", email = "hakem@ebi.ac.uk" },
]
# Every floor below is empirically bisected (not guessed): the first version
# where `uv pip install --resolution lowest-direct` produces a combination
# that actually installs *and* passes the test suite. There used to be a
# `numpy<2` ceiling too, inherited from the original Cython build's ABI
# requirement; dropped since this package has no C extension anymore and
# numba (the real numpy-compatibility gate here) has supported numpy 2.x
# since 0.60. .github/workflows/test.yaml's `floors` job re-verifies this
# combination on every push, so a bump in one dependency's real requirements
# gets caught instead of drifting silently.
dependencies = [
  "numpy>=1.25",
  "scipy>=1.12",
  "pandas>=2",
  "numba>=0.67",
  "anndata>=0.10",
  "h5py>=3.8",
  "scikit-learn>=1.3",
  "igraph>=0.11",
  "leidenalg>=0.12",
  "jsonargparse[signatures]>=4.49",
  "threadpoolctl>=3",
]

# User-facing extras: `pip install fastcellstates[plot]`.
[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
fastcellstates = "fastcellstates.cli:main"

# Dev-only tooling (PEP 735). Not published in the wheel/sdist metadata; a
# consumer never sees these.  `pixi install` pulls the `dev` group (below).
[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff>=0.16,<0.17", "mypy>=1.11", "pyright>=1.1.390", "pandas-stubs"]
profile = ["py-spy>=0.4.2", "scalene>=1.5.51"]
notebook = ["ipykernel", "jupyterlab", "scanpy>=1.9"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "profile" },
  { include-group = "notebook" },
]

# ---------------------------------------------------------------------------
# pixi: reproducible conda-backed dev environment (lockfile: pixi.lock).
# `pixi install` solves the env *and* installs this package editable, so
# `import fastcellstates` and the `fastcellstates` CLI work with no separate step.
#
# Runtime + plot deps are declared once in [project]; dev tooling once in
# [dependency-groups].  pixi's default env takes the `dev` group and the
# `plot` extra; it adds only the interpreter (pip cannot provide `python`)
# and a conda-forge ete3 for the optional ete3 hierarchy renderer: ete3's
# PyPI package is unmaintained and ships broken metadata (its __init__
# imports `six` / `numpy` / `lxml` without declaring them).
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
fastcellstates = { path = ".", editable = true, extras = ["plot"] }

[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.environments]
default = { features = ["dev"] }
plot = { features = ["dev", "ete3"] }

[tool.pixi.feature.ete3.dependencies]
ete3 = "*"

[tool.pixi.tasks]
test = { cmd = "pytest -q", description = "Run the test suite" }
lint = { cmd = "ruff check src test benchmarks && ruff format --check src test && mypy src && pyright src", description = "ruff (check + format-check) + mypy + pyright" }
fmt = { cmd = "ruff check --fix src test benchmarks && ruff format src test", description = "Autofix lint + reformat (skips _dm_kernels.py: its numba math is hand-laid-out)" }
clean-numba = { cmd = "rm -rf src/fastcellstates/__pycache__", description = "Clear numba's on-disk kernel cache: run after editing an @njit(cache=True) function, since a caller in another file that inlines it can keep a stale compiled copy" }

[tool.hatch.build.targets.wheel]
packages = ["src/fastcellstates"]

# Explicit sdist manifest.  Hatchling otherwise ships everything not caught by
# .gitignore, so a stray local file (scratch script, agent config) would end
# up in a published release.  Listing the contents makes the sdist identical
# no matter whose tree built it.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/test",
  "/benchmarks",
  "/pyproject.toml",
  "/README.md",
  "/CITATION.cff",
  "/docs/changes.md",
  "/docs/_static",
  "/docs/notebooks",
  "/LICENSE*",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
extend-include = ["*.ipynb"]
format.docstring-code-format = true
# _dm_kernels.py is ~1200 lines of tight numba arithmetic laid out by hand for
# readability of the math; leave its whitespace alone.
format.exclude = ["src/fastcellstates/model/_dm_kernels.py"]
lint.select = [
  "B",   # flake8-bugbear: mutable defaults, unused loop vars, ...
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # Pyflakes: unused imports, undefined names, ...
  "I",   # isort
  "PTH", # flake8-use-pathlib
  "RUF", # Ruff-specific
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [
  "B905",   # zip() without explicit strict=
  "C408",   # dict()/list() call vs literal
  "E501",   # line too long: formatter handles it; the rest are unfixable strings
  "E741",   # ambiguous name (l, I): `l` is the labels kwarg on the Cluster API
  "RUF001", # ambiguous unicode in strings: intentional (Theta, lambda, x in math/labels)
  "RUF002", # ambiguous unicode in docstrings
  "RUF003", # ambiguous unicode in comments
  "SIM108", # ternary vs if/else: not always clearer
  "SIM114", # merge `if a: x` / `elif b: x`: keeps distinct guard clauses separate
]
lint.per-file-ignores."*/__init__.py" = ["F401"]
# benchmarks are analysis throwaways: semicolon one-liners, sys.path hacks,
# os.path, dead locals are all tolerable there.
lint.per-file-ignores."benchmarks/*" = ["E402", "E702", "F841", "PTH", "RUF007", "RUF059"]
lint.per-file-ignores."test/*" = ["E702"]

[tool.mypy]
mypy_path = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
# _dm_kernels.py is numba-JIT'd; its signatures deliberately break static typing.
exclude = ['^src/fastcellstates/model/_dm_kernels\.py$', '^benchmarks/', '^notebooks/']

# scipy.sparse ships only partial inline types: the "counts is dense or
# sparse" boundaries are annotated with ``_types.Counts`` and coerce via
# ``sp.csc_matrix(x)`` so pyright resolves them (see _types.py).
[tool.pyright]
include = ["src"]
exclude = [
  "**/__pycache__", "**/.pixi", "notebooks", "benchmarks",
  "src/fastcellstates/model/_dm_kernels.py",  # numba-JIT'd; signatures break static typing
  "src/fastcellstates/plotting.py",           # optional ete3 GUI dep (no stubs, unmaintained)
]
