[workspace]
name = "upstream-cellstates-bench"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = "<2"
scipy = "*"
pandas = "*"
matplotlib-base = "*"
cython = "*"
c-compiler = "*"
pip = "*"

[pypi-dependencies]
cellstates = { git = "https://github.com/nimwegenLab/cellstates.git" }

[pypi-options]
no-build-isolation = ["cellstates"]
